<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; background: #f5f5f5; color: #222; }
    .header { background: #6B4226; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header span { font-size: 11px; opacity: 0.7; }
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #777; margin-bottom: 4px; }
    .row { display: flex; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    label { font-size: 11px; color: #555; font-weight: 500; }
    input, select { border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; font-size: 12px; background: white; width: 100%; outline: none; transition: border-color 0.15s; }
    input:focus, select:focus { border-color: #6B4226; }
    .tickets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .ticket-field { display: flex; align-items: center; gap: 6px; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 5px 8px; }
    .ticket-field label { font-size: 11px; flex: 1; color: #444; }
    .ticket-field input { width: 36px; text-align: center; padding: 3px 4px; border: none; border-left: 1px solid #eee; border-radius: 0; font-size: 13px; font-weight: 600; }
    #visitors-container { display: flex; flex-direction: column; gap: 6px; }
    .visitor-row { display: flex; gap: 6px; align-items: center; }
    .visitor-row input { flex: 1; }
    .visitor-num { width: 20px; min-width: 20px; height: 20px; background: #6B4226; color: white; border-radius: 50%; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .btn-run { background: #6B4226; color: white; border: none; border-radius: 8px; padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.15s; }
    .btn-run:hover { background: #5a3720; }
    .btn-run:disabled { background: #aaa; cursor: not-allowed; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 6px; text-align: center; display: none; }
    .status.info    { background: #fdf3e7; color: #6B4226; display: block; }
    .status.success { background: #eafaf1; color: #1e8449; display: block; }
    .status.error   { background: #fdedec; color: #c0392b; display: block; }
    .step-indicator { display: flex; justify-content: center; gap: 4px; padding: 4px 0; }
    .step { width: 8px; height: 8px; border-radius: 50%; background: #ddd; transition: background 0.2s; }
    .step.active { background: #6B4226; }
    .step.done   { background: #1e8449; }
    hr { border: none; border-top: 1px solid #eee; }
  </style>
</head>
<body>
<div class="header">
  <div>
    <h1>🏛 Pantheon Rome Bot</h1>
    <span>Scop Tickets — Autocompletado</span>
  </div>
</div>
<div class="body">

  <div>
    <div class="section-title">Tickets</div>
    <div class="tickets-grid">
      <div class="ticket-field">
        <label>Intero (adulto)</label>
        <input type="number" id="t-full" min="0" max="10" value="0">
      </div>
      <div class="ticket-field">
        <label>Ridotto (reducido)</label>
        <input type="number" id="t-reduced" min="0" max="10" value="0">
      </div>
      <div class="ticket-field">
        <label>Free (menor 18)</label>
        <input type="number" id="t-free" min="0" max="10" value="0">
      </div>
    </div>
  </div>

  <hr>

  <div>
    <div class="section-title">Nombre completo de visitantes</div>
    <div id="visitors-container">
      <div style="font-size:11px; color:#999; text-align:center; padding:6px 0;">
        Completá los tickets arriba para ver los campos
      </div>
    </div>
  </div>

  <hr>

  <div class="step-indicator" id="steps">
    <div class="step" id="s4" title="Tickets"></div>
    <div class="step" id="s5" title="Guest"></div>
    <div class="step" id="s6" title="Visitantes"></div>
  </div>

  <div class="status" id="status">Listo</div>
  <button class="btn-run" id="btn-run">▶ Completar formulario</button>

</div>
<script src="popup.js"></script>
</body>
</html>
